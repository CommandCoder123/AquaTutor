<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaTutor—Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        body {
            background-color: rgb(0, 0, 0);
            font-family: Verdana, Tahoma, sans-serif;
            padding: 0%;
            margin: 0;
            width: 100vw;
            height: auto;
            overflow-x: hidden;
        }

        .underline {
            display: inline-block;
            position: relative;
            margin: 20px 16px;
            text-decoration: none;
            font-size: 20px;
            color: rgb(255, 255, 255);
            text-decoration: none;
            background: none;
            border: none;
            padding: 0;
        }

        .underline::after {
            content: '';
            position: absolute;
            width: 100%;
            transform: scaleX(0);
            height: 2px;
            bottom: 0;
            left: 0;
            background-color: #919191;
            transition: transform 0.25s ease-out;
        }

        .underline:hover {
            color: rgb(211, 211, 211);
        }

        .underline:hover::after {
            transform: scaleX(1);
        }

        .active::after {
            transform: scaleX(1);
        }

        .left .underline::after {
            transform-origin: bottom left;
        }

        .left .underline:hover::after {
            transform-origin: bottom left;
        }

        .underline::after {
            transform-origin: bottom center;
        }

        .underline:hover::after {
            transform-origin: bottom center;
        }

        .wrapper {
            display: flex;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            align-items: center;
        }

        .panel {
            width: 99%;
            height: 99%;

            display: flex;
            overflow-y: hidden;
        }

        .navigation {
            width: 25%;
            min-width: 250px;
            height: auto;
            border-top-left-radius: 20px;
            border-bottom-left-radius: 20px;
            border: solid;
            border-color: #2e2e2e;
            border-width: 1px;
            border-right: none;
        }

        .other {
            height: 100%;
            width: auto;
            background-color: #0f0f0f;
            border-top-right-radius: 20px;
            border-bottom-right-radius: 20px;
            border: solid;
            border-color: #2e2e2e;
            border-width: 1px;
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 0px;
        }

        .nav-item {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 0;
            margin: 10% 10% 10% 15%;
            width: auto;
        }

        .nav-item img {
            width: 20%;
        }

        .nav-item p {
            margin: 10px;
            color: rgb(180, 180, 180);
        }

        .nav-other a {
            color: rgb(180, 180, 180);
        }

        a {
            text-decoration: none;
        }

        .nav-item:hover {
            cursor: pointer;
        }

        .nav {
            margin-left: 10%;
            margin-bottom: 50px;
            margin-top: 40px;
            max-width: 80%;
        }

        .bottom {
            bottom: 0%;
            position: fixed;
        }


        .topnav {
            overflow: hidden;
        }

        .topnav a {
            color: white;
            margin: 20px 16px;
            text-decoration: none;
            font-size: 20px;
        }

        .nav-other {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 0;
            width: 15%;
            margin: 0;
        }

        .nav-other img {
            width: 100%;
        }

        .topnav #myLinks {
            display: none;
            background: #2e2e2e;
            margin: 10px;
            padding: 10px;
            border: solid #919191 1px;
            border-radius: 20px;
        }

        h2 {
            background: linear-gradient(135deg, #3fc6fc, #6a5ffd);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 14px 16px;
            font-size: 25px;
        }

        p {
            color: #3fc6fc;
            margin: 14px 16px;
            font-size: 15px;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div class="panel">
            <div class="navigation left">
                <img src="Assets/Logo.png" alt="Aqua Tutor" class="nav">
                <a href="" class="nav-item underline"><img src="Assets/house-regular-full.svg" alt="home-icon">
                    <p>home</p>
                </a>

                <a href="" class="nav-item underline"><img src="Assets/rectangle-list-regular-full.svg" alt="home-icon">
                    <p>Meets</p>
                </a>

                <a href="" class="nav-item underline"><img src="Assets/user-regular-full.svg" alt="home-icon">
                    <p>Coach</p>
                </a>

                <a href="" class="nav-item underline"><img src="Assets/muscle.png" alt="home-icon">
                    <p>Power</p>
                </a>

                <div class="bottom">
                    <div class="topnav">
                        <div id="myLinks">
                            <h2><span id="swimmer-name">Swimmer</span></h2>
                            <p>Member since: <span id="date-created">Loading...</span></p>
                            <button class="underline" id="logout-button">LogOut</button>
                        </div>
                        <a href="javascript:void(0);" class="nav-other underline" onclick="myFunction()">
                            <img src="Assets/house-user-solid-full.svg" alt="home-icon">
                        </a>
                    </div>
                </div>
            </div>
            <div class="other">

            </div>
        </div>
    </div>
    <script type="module" src="dashboard.js"></script>
    <script>
        function myFunction() {
            var x = document.getElementById("myLinks");
            if (x.style.display === "block") {
                x.style.display = "none";
            } else {
                x.style.display = "block";
            }
        }
    </script>
</body>

</html>
